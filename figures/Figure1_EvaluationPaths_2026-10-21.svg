   <g id="text_1">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2e3a" x="9" y="14.400391" transform="rotate(-0 9 14.400391)">Image-to-patient MES evaluation on LIMUC</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2e3a" x="9" y="29.345469" transform="rotate(-0 9 29.345469)">ViT-B/16 and Swin-B use image-label supervision; evaluation paths remain distinct.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #205c7c" x="9" y="48.759375" transform="rotate(-0 9 48.759375)">A  PATIENT-GROUPED NESTED DEVELOPMENT EVALUATION</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2e3a" x="16" y="72.483437" transform="rotate(-0 16 72.483437)">Development cohort</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1b2e3a" transform="translate(16 88.458672)">9,590 images / 478 patients</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1b2e3a" transform="translate(16 98.105986)">5 outer folds; hold out one</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1b2e3a" transform="translate(16 107.7533)">Keep each patient together</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2e3a" x="187" y="72.483437" transform="rotate(-0 187 72.483437)">4-fold inner selection</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1b2e3a" transform="translate(187 88.458672)">Select loss, aggregation,</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1b2e3a" transform="translate(187 98.105986)">family and refit duration</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1b2e3a" transform="translate(187 107.7533)">Only outer-training patients</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2e3a" x="358" y="72.483437" transform="rotate(-0 358 72.483437)">Refit and predict</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1b2e3a" transform="translate(358 88.458672)">Refit outer-training data</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1b2e3a" transform="translate(358 98.105986)">Predict held-out outer fold</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1b2e3a" transform="translate(358 107.7533)">No outer-guided selection</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2e3a" x="9" y="136.345469" transform="rotate(-0 9 136.345469)">Pool all five outer folds separately per seed; patient scoring uses modal-low (C).</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2e3a" x="9" y="149.345469" transform="rotate(-0 9 149.345469)">Six aggregation candidates; all outer folds selected mean probability followed by argmax.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #205c7c" x="9" y="171.759375" transform="rotate(-0 9 171.759375)">B  LOCKED OFFICIAL-PARTITION RE-EVALUATION</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2e3a" x="16" y="195.448281" transform="rotate(-0 16 195.448281)">Official test images</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1b2e3a" transform="translate(16 211.458672)">1,686 images; 86 patients</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1b2e3a" transform="translate(16 221.105986)">Previously examined</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2e3a" x="168" y="195.448281" transform="rotate(-0 168 195.448281)">15 checkpoints per family</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1b2e3a" transform="translate(168 211.458672)">5 development folds × 3 seeds</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1b2e3a" transform="translate(168 221.105986)">Historical fixed ensemble</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2e3a" x="353" y="195.483438" transform="rotate(-0 353 195.483438)">Two views per checkpoint</text>
   </g>
   <g id="text_18">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1b2e3a" transform="translate(353 211.458672)">Original + horizontal flip</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1b2e3a" transform="translate(353 221.105986)">Mean of 30 softmax vectors</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2e3a" x="16" y="270.448281" transform="rotate(-0 16 270.448281)">Image probabilities</text>
   </g>
   <g id="text_20">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1b2e3a" transform="translate(16 286.458672)">Four-class image vector</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1b2e3a" transform="translate(16 296.105986)">Separate ViT and Swin</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1b2e3a" transform="translate(16 305.7533)">probability averages</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2e3a" x="168" y="270.413125" transform="rotate(-0 168 270.413125)">Image argmax</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2e3a" x="353" y="270.448281" transform="rotate(-0 353 270.448281)">Image-level scoring</text>
   </g>
   <g id="text_23">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2e3a" x="353" y="286.458672" transform="rotate(-0 353 286.458672)">Compare with image labels</text>
   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2e3a" x="168" y="310.448281" transform="rotate(-0 168 310.448281)">Patient mean → argmax</text>
   </g>
   <g id="text_25">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2e3a" x="168" y="326.458672" transform="rotate(-0 168 326.458672)">Average image probabilities</text>
   </g>
   <g id="text_26">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2e3a" x="353" y="310.448281" transform="rotate(-0 353 310.448281)">Patient-level scoring</text>
   </g>
   <g id="text_27">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2e3a" x="353" y="326.458672" transform="rotate(-0 353 326.458672)">Compare with modal-low (C)</text>
   </g>
   <g id="text_28">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2e3a" x="9" y="350.345469" transform="rotate(-0 9 350.345469)">Official labels enter scoring only during re-evaluation; these are not nested outer refits.</text>
   </g>
   <g id="text_29">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #205c7c" x="9" y="372.759375" transform="rotate(-0 9 372.759375)">C  REFERENCE CONSTRUCTION IS SEPARATE FROM PREDICTION</text>
   </g>
   <g id="text_30">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2e3a" x="16" y="396.448281" transform="rotate(-0 16 396.448281)">Released image labels</text>
   </g>
   <g id="text_31">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2e3a" x="16" y="412.458672" transform="rotate(-0 16 412.458672)">Expert MES labels 0–3</text>
   </g>
   <g id="text_32">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2e3a" x="187" y="396.483437" transform="rotate(-0 187 396.483437)">Modal-low reference</text>
   </g>
   <g id="text_33">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2e3a" x="187" y="412.458672" transform="rotate(-0 187 412.458672)">Modal grade; lower-grade ties</text>
